# See: https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions

name: 'Deploy [production] All'

permissions:
  contents: read
  actions: read
  deployments: write
  id-token: write

on:
  workflow_dispatch:

jobs:
  deploy_service:
    name: 'Build + Deploy: api-service'
    uses: ./.github/workflows/deploy_prod_api-service.yml
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
  publish_pipeline_docker_image:
    name: 'Publish: Production Pipeline Docker Image'
    uses: ./.github/workflows/publish_prod_pipeline_docker_image.yml
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  deploy_pipeline_scheduler:
    name: 'Build + Deploy: pipeline-scheduler'
    uses: ./.github/workflows/deploy_prod_pipeline_scheduler.yml
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
