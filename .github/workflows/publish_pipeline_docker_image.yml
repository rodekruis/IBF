name: 'Publish: Pipeline Docker Image'

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Build for test or promote an existing image to prod'
        type: choice
        options:
          - test
          - production
        default: test
        required: true
      commit_sha:
        description: 'Full commit SHA of the existing image (required for prod)'
        type: string
        required: false
  push:
    branches:
      - main
    paths:
      - 'data/**'
      - '.github/workflows/publish_pipeline_docker_image.yml'

permissions:
  contents: read
  deployments: write
  id-token: write

concurrency:
  group: publish-pipeline-docker-image
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and Push
    environment: ${{ inputs.environment || 'test' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and Push Pipeline Image
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment || 'test' }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: bash data/pipelines/deploy/build-and-push-image.sh "${TARGET_ENVIRONMENT}" "${COMMIT_SHA}"

      - name: Summarize Published Image
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment || 'test' }}
          COMMIT_SHA: ${{ inputs.commit_sha || github.sha }}
        run: |
          IMAGE_REPOSITORY="nrwdockerregistry.azurecr.io/pipelines"
          if [[ "${TARGET_ENVIRONMENT}" == "production" ]]; then
            MOVING_TAG="production"
          else
            MOVING_TAG="latest"
          fi
          {
            echo "### Published Pipeline Image"
            echo
            echo "**Environment:** \`${TARGET_ENVIRONMENT}\`"
            echo
            echo "**Commit SHA:** \`${COMMIT_SHA}\`"
            echo
            echo "**Commit image:** \`${IMAGE_REPOSITORY}:${COMMIT_SHA}\`"
            echo
            echo "**Published tag:** \`${IMAGE_REPOSITORY}:${MOVING_TAG}\`"
          } | tee -a "${GITHUB_STEP_SUMMARY}"
