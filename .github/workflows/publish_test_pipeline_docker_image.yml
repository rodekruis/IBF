name: 'Publish: Pipeline Docker Image'

on:
  workflow_call:
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'data/**'

permissions:
  contents: read
  deployments: write
  id-token: write

concurrency:
  group: publish-pipeline-docker-image
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and Push
    environment: 'test'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and Push Pipeline Image
        run: bash data/pipelines/deploy/build-and-push-image.sh "test"
