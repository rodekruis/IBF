# See: https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions

name: 'Deploy [staging] All'

permissions:
  contents: read
  actions: read
  deployments: write
  id-token: write

on:
  workflow_call:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  deploy_service:
    name: 'Build + Deploy: api-Service'
    uses: ./.github/workflows/deploy_staging_api-service.yml
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
  publish_pipeline_image:
    name: 'Publish: Staging Pipeline Docker Image'
    uses: ./.github/workflows/publish_pipeline_docker_image_staging.yml
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
