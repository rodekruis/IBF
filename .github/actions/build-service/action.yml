# See: https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions
# More specific about composite actions: https://docs.github.com/en/actions/creating-actions/metadata-syntax-for-github-actions

name: 'Build: Service'
description: Builds a service for deployment.

inputs:
  servicePath:
    description: Location of the service code.
    required: true
  databaseUrl:
    description: Database connection string.
    required: true

outputs:
  build_version:
    description: Specific version of the build service.
    value: ${{ steps.version.outputs.build_version }}

runs:
  using: composite
  steps:
    - name: Set up Node.js version
      uses: actions/setup-node@v4
      with:
        # See supported Node.js versions: https://github.com/Azure/app-service-linux-docs/blob/master/Runtime_Support/node_support.md
        node-version-file: ${{ inputs.servicePath }}/.node-version
        cache: npm
        cache-dependency-path: ${{ inputs.servicePath }}/package-lock.json

    - name: Install
      shell: bash
      working-directory: ${{ inputs.servicePath }}
      run: |
        npm ci

    - name: Add firewall rule for database
      uses: azure/cli@v1
      env:
        DATABASE_URL: ${{ inputs.databaseUrl }}
        RUN_ID: ${{ github.run_id }}_${{ github.run_attempt }}
      with:
        inlineScript: |
          # Install necessary packages for `rdbms-connect` extension. Use Tiny DNF as the Azure-CLI container-image is based on Azure Linux
          tdnf install -y build-essential python3-devel postgresql-devel gcc --quiet

          # Ensure the `rdbms-connect` extension is installed for Azure CLI
          az extension add -n rdbms-connect

          # Retrieve the public IP address of the deployment runner
          COUNT=1
          echo "Attempt $COUNT to retrieve the public IP address of the deployment runner..."
          until IP=$(curl --fail --silent --show-error \
            --connect-timeout 5 --max-time 10 https://api.ipify.org) \
            && [[ -n "$IP" ]]; do
            ((COUNT++))
            if [[ $COUNT -gt 10 ]]; then
              echo "Error: Unable to retrieve public IP address after $COUNT attempts. Exiting."
              exit 1
            else
              echo "Retrying in 3 seconds..."
              sleep 3
            fi
          done

          # Extract variables from the database URL
          # Make sure the password is not fed into psql directly, to avoid exposing it in process lists
          db_host="${DATABASE_URL##*@}"
          db_server_name="${db_host%%.*}"
          db_connection_url="${DATABASE_URL%%\?*}"
          db_connection_details="${db_connection_url#*://}"
          db_encoded_creds="${db_connection_details%%@*}"
          db_username="${db_encoded_creds%%:*}"
          db_encoded_password="${db_encoded_creds#*:}"
          printf -v database_password '%b' "${db_encoded_password//%/\\x}"
          db_connection_url_without_password="${db_connection_url%%://*}://${db_username}@${db_connection_details#*@}"

          # Add firewall rule for the deployment runner's IP address
          echo "Adding firewall rule 'GH_runner_${RUN_ID}' for IP: $IP"
          az postgres flexible-server firewall-rule create \
          --name "GH_runner_${RUN_ID}" \
          --server-name "$db_server_name" \
          --resource-group NRW \
          --start-ip-address $IP \
          --end-ip-address $IP

          # Allow the firewall rule to be applied
          echo "Waiting for firewall rule to be applied..."
          sleep 3
          COUNT=1
          until PGPASSWORD="$database_password" PGCONNECT_TIMEOUT=10 \
            psql --dbname="$db_connection_url_without_password" \
              --no-psqlrc --no-password --set=ON_ERROR_STOP=1 \
              --command='SELECT 1;' >/dev/null; do
            echo "Attempt $COUNT failed"
            ((COUNT++))
            if [[ $COUNT -gt 20 ]]; then
              echo "Error: Firewall rule not applied after $COUNT attempts. Exiting."
              exit 1
            else
              echo "Retrying in 30 seconds..."
              sleep 30
            fi
          done
          echo "Database is accessible"

    - name: Run database migrations
      shell: bash
      working-directory: ${{ inputs.servicePath }}
      run: npm run prisma:migrate:deploy
      env:
        DATABASE_URL: ${{ inputs.databaseUrl }}

    - name: Remove firewall rule for database
      if: ${{ always() }}
      uses: azure/cli@v1
      env:
        DATABASE_URL: ${{ inputs.databaseUrl }}
        RUN_ID: ${{ github.run_id }}_${{ github.run_attempt }}
      with:
        inlineScript: |
          db_host="${DATABASE_URL##*@}"
          db_server_name="${db_host%%.*}"

          az postgres flexible-server firewall-rule delete \
            --name "GH_runner_${RUN_ID}" \
            --server-name "$db_server_name" \
            --resource-group NRW \
            --yes

    - name: Generate Prisma
      shell: bash
      working-directory: ${{ inputs.servicePath }}
      run: |
        npm run prisma:generate

    - name: Test
      shell: bash
      working-directory: ${{ inputs.servicePath }}
      run: |
        npm run typecheck
        npm run test

    - name: Build
      shell: bash
      working-directory: ${{ inputs.servicePath }}
      run: |
        npm run build

    - name: Set VERSION of build/deployment
      shell: bash
      run: |
        echo "GLOBAL_IBF_VERSION=$(git describe --tags --dirty --broken)" >> $GITHUB_ENV

    - name: Add VERSION to deployment
      id: version
      shell: bash
      working-directory: ${{ inputs.servicePath }}
      run: |
        echo "${{ env.GLOBAL_IBF_VERSION }}" >> ./VERSION.txt
        echo "build_version=${{ env.GLOBAL_IBF_VERSION }}" >> $GITHUB_OUTPUT

    - name: Reduce build package size
      shell: bash
      working-directory: ${{ inputs.servicePath }}
      run: |
        npm prune --omit=dev
        rm -r -f .vscode/
        rm -r -f test/
        rm -r -f ./*.md

    - name: Create ZIP package
      shell: bash
      working-directory: ${{ inputs.servicePath }}
      run: zip --quiet --display-globaldots --recurse-paths artifact.zip .

    - name: Verify Build
      shell: bash
      working-directory: ${{ inputs.servicePath }}
      run: test -s artifact.zip
